[project]
name = "cae-trainer"
version = "0.1.0"
description = "Cambridge C1 Advanced trainer: generates and marks Reading & Use of English and Writing practice with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.51",
    "langgraph>=1.2",
    "langchain-core>=1.5",
    "langchain-google-genai>=4.2",
    "langchain-mistralai>=1.1",
    "langchain-groq>=1.1",
    "langchain-chroma>=0.2",
    "protobuf>=5,<7",
    "langsmith>=0.10.15",
    "sqlalchemy>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "pandas>=2.2",
    "altair>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.0"]
evals = ["langchain-openai>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cae"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
